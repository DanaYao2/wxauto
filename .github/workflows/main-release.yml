name: Main Release

on:
  workflow_call:
    inputs:
      release-ref:
        description: Tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 第一步：确认 Tag 对应的提交已经包含在 master 历史中
  check:
    name: Verify release commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref }}
          fetch-depth: 0

      - name: Check master ancestry
        shell: bash
        run: |
          git fetch origin master

          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Release commit is not contained in master."
            exit 1
          fi

          echo "Release commit is contained in master."

  # 第二步：分别构建 Python 3.10 和 3.11 的 wheel
  build:
    name: Build ${{ matrix.abi }} wheel
    needs: check
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            abi: cp310
          - python-version: "3.11"
            abi: cp311
          - python-version: "3.12"
            abi: cp312
          - python-version: "3.13"
            abi: cp313

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      # 将 Tag 版本同步到 pyproject.toml
      - name: Set version from tag
        shell: pwsh
        env:
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          $tag = $env:RELEASE_REF

          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:[.-][0-9A-Za-z.-]+)?)$') {
            throw "Invalid release tag: $tag"
          }

          $version = $Matches[1]
          $path = "pyproject.toml"

          $content = Get-Content $path -Raw

          # 只修改 [project] 区块中的 version，避免误改其他区块
          $pattern = '(?ms)(^\[project\][ \t]*\r?\n.*?^\s*version\s*=\s*)("[^"]+"|''[^'']+'')'

          if (-not [regex]::IsMatch($content, $pattern)) {
            throw "Could not find a static version field in [project] of pyproject.toml."
          }

          $content = [regex]::Replace(
            $content,
            $pattern,
            {
              param($match)
              return $match.Groups[1].Value + '"' + $version + '"'
            },
            1
          )

          Set-Content -Path $path -Value $content -Encoding utf8

          Write-Host "Set project version to $version"

      # 删除其他 Python 版本的二进制扩展
      - name: Filter incompatible Pyd files
        shell: pwsh
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          $target = $env:TARGET_ABI

          $allPyd = @(
            Get-ChildItem -Path . -Recurse -File -Filter *.pyd |
              Where-Object {
                $_.FullName -notmatch '[\\/](\.git|\.venv|venv)[\\/]'
              }
          )

          if ($allPyd.Count -eq 0) {
            throw "No .pyd files found."
          }

          $pattern = [regex]::Escape($target) + '-win_amd64'

          $matched = @(
            $allPyd | Where-Object {
              $_.Name -match $pattern
            }
          )

          if ($matched.Count -eq 0) {
            throw "No matching $target-win_amd64 files found."
          }

          Write-Host "Keeping these files:"
          $matched | ForEach-Object {
            Write-Host "  $($_.FullName)"
          }

          foreach ($file in $allPyd) {
            if ($file.Name -notmatch $pattern) {
              Remove-Item -LiteralPath $file.FullName -Force
              Write-Host "Removed: $($file.FullName)"
            }
          }

      - name: Install build dependencies
        run: python -m pip install --upgrade build setuptools wheel

      - name: Build wheel
        run: python -m build --wheel

      # 确保 wheel 的 Python ABI 和平台标签正确
      - name: Validate wheel filename
        shell: pwsh
        env:
          TARGET_ABI: ${{ matrix.abi }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          $wheels = @(Get-ChildItem dist -Filter *.whl)

          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, found $($wheels.Count)."
          }

          $expected = "$($env:TARGET_ABI)-$($env:TARGET_ABI)-win_amd64"

          if ($wheels[0].Name -notlike "*-$expected.whl") {
            throw "Unexpected wheel filename: $($wheels[0].Name)"
          }

          $version = $env:RELEASE_REF -replace '^v', ''
          $expectedVersion = $version -replace '-', '_'

          if ($wheels[0].Name -notlike "wxauto-$expectedVersion-$expected.whl") {
            throw "Wheel version or filename does not match the release tag: $($wheels[0].Name)"
          }

          Write-Host "Validated wheel: $($wheels[0].Name)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.abi }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # 第三步：两个 Python 版本都构建成功后，发布 GitHub Release
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-ref }}
          files: dist/*.whl
          generate_release_notes: true