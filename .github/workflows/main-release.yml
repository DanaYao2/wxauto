
name: Main Release

on:
  workflow_call:
    inputs:
      release-ref:
        description: Tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Verify release commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref }}
          fetch-depth: 0

      - name: Check master ancestry
        shell: bash
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Release commit is not contained in master."
            exit 1
          fi

  build:
    name: Build ${{ matrix.abi }} wheel
    needs: check
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            abi: cp310
          - python-version: "3.11"
            abi: cp311

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Filter incompatible Pyd files
        shell: pwsh
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          $target = $env:TARGET_ABI

          $allPyd = @(
            Get-ChildItem -Path . -Recurse -File -Filter *.pyd |
              Where-Object {
                $_.FullName -notmatch '[\\/](\.git|\.venv|venv)[\\/]'
              }
          )

          if ($allPyd.Count -eq 0) {
            throw "No .pyd files found."
          }

          $matched = @(
            $allPyd | Where-Object {
              $_.Name -match (
                [regex]::Escape($target) + '-win_amd64'
              )
            }
          )

          if ($matched.Count -eq 0) {
            throw "No matching $target-win_amd64 files found."
          }

          foreach ($file in $allPyd) {
            if ($file.Name -notmatch (
              [regex]::Escape($target) + '-win_amd64'
            )) {
              Remove-Item $file.FullName
            }
          }

      - name: Install build dependencies
        run: python -m pip install --upgrade build setuptools wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Validate wheel filename
        shell: pwsh
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          $wheels = @(Get-ChildItem dist -Filter *.whl)

          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel."
          }

          $expected = "$($env:TARGET_ABI)-$($env:TARGET_ABI)-win_amd64"

          if ($wheels[0].Name -notlike "*-$expected.whl") {
            throw "Unexpected wheel filename: $($wheels[0].Name)"
          }

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.abi }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-ref }}
          files: dist/*.whl
          generate_release_notes: true
