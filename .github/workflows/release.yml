name: Release

on:
  # 只有推送 v* Tag 时自动触发
  push:
    tags:
      - "v*"

  # 支持手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v39.1.13)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Run Main Release
    uses: ./.github/workflows/main-release.yml
    with:
      release-ref: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write