name: release.yml
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v39.1.13)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/main-release.yml
    with:
      release-ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: write
